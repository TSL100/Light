# LinuxDFIR detection tuning. Copy this file and pass it with
# `linuxdfir detect --config my.toml` (or `run --config`) to override
# any section without touching code. Lists replace the defaults wholesale.

[package_tools]
# Attacker tool families flagged on install/update. Each entry matches as
# a dash/underscore/dot-separated name component (netcat hits
# netcat-traditional and netcat-openbsd alike).
tools = ["nmap", "netcat", "hydra", "john", "masscan", "tcpdump", "socat"]

[bulk_batch]
# Install/update records at or above this count inside window_minutes are
# treated as base-image provisioning, not attacker activity.
threshold = 50
window_minutes = 10

[default_image_packages]
# Exact package names (without :arch) that ship in default cloud/WSL
# images. Suppressed to INFO unless explicitly requested or part of an
# attack chain. netcat-traditional is deliberately NOT listed: it is the
# classic attacker choice and must always raise a finding.
packages = ["netcat-openbsd"]

[timestomp]
# ctime more than threshold_days after mtime counts as a timestomp
# indicator. Thresholds below ~1 day produce noise from package installs.
threshold_days = 1

[suid]
# SUID/SGID binaries expected on a normal host. Anything outside this
# list raises unusual_suid; binaries in world-writable paths are HIGH
# even when the name looks familiar.
allowlist = [
    "/usr/bin/sudo", "/usr/bin/su", "/bin/su",
    "/usr/bin/passwd", "/bin/passwd",
    "/usr/bin/chsh", "/usr/bin/chfn", "/usr/bin/newgrp", "/usr/bin/gpasswd",
    "/usr/bin/pkexec",
    "/usr/bin/mount", "/bin/mount", "/usr/bin/umount", "/bin/umount",
    "/usr/bin/fusermount", "/usr/bin/fusermount3",
    "/usr/bin/ntfs-3g",
    "/usr/bin/at", "/usr/bin/crontab",
    "/usr/bin/ssh-agent", "/usr/bin/ssh-keysign",
    "/usr/bin/ping", "/bin/ping", "/usr/bin/traceroute",
    "/usr/sbin/pppd",
    "/usr/lib/dbus-1.0/dbus-daemon-launch-helper",
    "/usr/libexec/dbus-daemon-launch-helper",
    "/usr/lib/openssh/ssh-keysign",
]
writable_paths = ["/tmp/", "/var/tmp/", "/dev/shm/", "/home/", "/root/"]

[scratch_exec]
# World-writable scratch directories where an executable file (exec bit,
# hidden path or ELF content) is attacker tooling until proven otherwise.
paths = ["/tmp/", "/var/tmp/", "/dev/shm/"]
# Benign empty placeholder files (distro install markers) never alert.
allowlist = [".placeholder"]

[recent_changes]
# Recently modified files under these sensitive locations raise
# recent_changes_in_sensitive_paths; severity depends on the path class.
# Package-manager files inside cron dirs are allowlisted by name.
paths = [
    "/etc/cron.d/", "/etc/cron.daily/", "/etc/cron.hourly/",
    "/etc/cron.weekly/", "/etc/cron.monthly/",
    "/etc/sudoers.d/", "/etc/ld.so.preload",
    "/etc/systemd/system/", "/etc/profile.d/",
]
allowlist_names = ["apt-compat", "logrotate", ".placeholder", "hardening.sh", "man-db.cron"]

[processes]
# Ports a healthy listener may bind. Anything else is an unexpected
# listener (suspicious_processes).
allowed_ports = [22, 80, 443, 53, 25, 110, 143, 993, 995, 3306, 5432, 6379, 11211]
# Substring patterns (case-insensitive) for cryptominer processes.
miner_patterns = ["xmrig", "stratum+tcp", "stratum+ssl", "minerd", "cpuminer", "srigger"]
# Substring patterns marking reverse-shell command lines.
reverse_shell_patterns = [
    "nc -e ", "ncat -e ", "socat EXEC", "socat exec",
    ">&/dev/tcp", "> /dev/tcp", "bash -i ", "sh -i ",
]

[containers]
# Images treated as routine workloads. Anything else raises
# suspicious_containers (unknown image); privileged/docker.sock hints
# in the row text escalate to HIGH.
allowlist_images = [
    "nginx", "httpd", "redis", "memcached",
    "postgres", "mysql", "mariadb", "mongo",
    "alpine", "ubuntu", "debian", "busybox",
]
